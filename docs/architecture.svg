<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Google ADK onboarding agent architecture</title>
  <desc id="desc">Slack connects to a deterministic workflow, Google ADK, company knowledge, PostgreSQL, and human HR approval.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101426"/><stop offset="1" stop-color="#1b2140"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#929ab8"/></marker>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <text x="58" y="61" fill="#f7f8ff" font-family="Inter,Arial" font-size="27" font-weight="700">Google ADK Onboarding Agent</text>
  <text x="58" y="91" fill="#9da7c7" font-family="Inter,Arial" font-size="15">Verified identity · grounded guidance · deterministic operations · human escalation</text>
  <g font-family="Inter,Arial" filter="url(#shadow)">
    <g transform="translate(58 184)"><rect width="160" height="112" rx="18" fill="#342452" stroke="#8061b4"/><text x="22" y="40" fill="#fff" font-size="19" font-weight="700">Slack</text><text x="22" y="70" fill="#d7c5ed" font-size="14">verified profile</text><text x="22" y="91" fill="#d7c5ed" font-size="14">Done · Help</text></g>
    <g transform="translate(278 184)"><rect width="205" height="112" rx="18" fill="#253052" stroke="#5d72aa"/><text x="22" y="40" fill="#fff" font-size="18" font-weight="700">Workflow service</text><text x="22" y="70" fill="#c1cbea" font-size="14">tasks · quiet hours</text><text x="22" y="91" fill="#c1cbea" font-size="14">SLA · audit events</text></g>
    <g transform="translate(551 115)"><rect width="190" height="112" rx="18" fill="#163c46" stroke="#3b9298"/><text x="22" y="40" fill="#fff" font-size="18" font-weight="700">Google ADK</text><text x="22" y="70" fill="#a9dcda" font-size="14">Gemini conversation</text><text x="22" y="91" fill="#a9dcda" font-size="14">no write tools</text></g>
    <g transform="translate(551 322)"><rect width="190" height="112" rx="18" fill="#17364a" stroke="#4384a8"/><text x="22" y="40" fill="#fff" font-size="18" font-weight="700">Drive + Vertex</text><text x="22" y="70" fill="#afd4e8" font-size="14">approved knowledge</text><text x="22" y="91" fill="#afd4e8" font-size="14">cached retrieval</text></g>
    <g transform="translate(808 184)"><rect width="160" height="112" rx="18" fill="#45351c" stroke="#b58a46"/><text x="22" y="40" fill="#fff" font-size="18" font-weight="700">PostgreSQL</text><text x="22" y="70" fill="#ead2aa" font-size="14">identity · sessions</text><text x="22" y="91" fill="#ead2aa" font-size="14">task evidence</text></g>
    <g transform="translate(1022 184)"><rect width="130" height="112" rx="18" fill="#47262e" stroke="#a75d6d"/><text x="18" y="40" fill="#fff" font-size="18" font-weight="700">HR owner</text><text x="18" y="70" fill="#e8bdc6" font-size="13">help request</text><text x="18" y="90" fill="#e8bdc6" font-size="13">SLA escalation</text></g>
  </g>
  <g stroke="#929ab8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M218 240 H267"/><path d="M483 218 C520 218 520 171 540 171"/><path d="M483 265 C520 265 520 378 540 378"/><path d="M741 171 C780 171 780 218 797 218"/><path d="M741 378 C780 378 780 265 797 265"/><path d="M968 240 H1011"/></g>
  <rect x="278" y="475" width="690" height="48" rx="14" fill="#222943" stroke="#4c5679"/><text x="623" y="505" text-anchor="middle" fill="#c1c9df" font-family="Inter,Arial" font-size="14">Structured logs · workflow evaluations · citation guardrails · human-in-the-loop evidence</text>
</svg>

[project]
name = "google-adk-onboarding-agent"
version = "0.1.0"
description = "Multilingual employee onboarding operations agent built with Google ADK and Slack."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
integrations = [
  "apscheduler>=3.11,<4",
  "google-adk>=1.25,<2",
  "google-cloud-aiplatform>=1.139,<2",
  "google-api-python-client>=2.180,<3",
  "google-auth>=2.40,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "slack-bolt>=1.27,<2",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
onboarding-eval = "onboarding_agent.eval_runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onboarding_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
